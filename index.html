<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>CAN Diagnostic · Glasses Demo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#000;color:white}*{box-sizing:border-box}body{margin:0;background:#000}.app{width:min(100%,600px);min-height:min(100dvh,600px);margin:auto;padding:24px;display:flex;flex-direction:column;gap:16px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}header h1{font-size:25px;color:#5be5ff;margin:0}small{color:#9cb0c0;font-size:14px}.tag{color:#f5c06c;border:1px solid #6a4b25;padding:6px 10px;border-radius:9px;font-weight:700;font-size:13px}h2{font-size:18px;margin:3px 0 0;color:#f3f5f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meter{background:#101d27;border:1px solid #284655;border-radius:13px;padding:16px;min-height:120px}.name{color:#a8c0cc;font-size:14px}.value{color:#f5f9fb;font-size:32px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:8px}.unit{color:#50dbff;font-size:13px}.nav{margin-top:auto;display:flex;gap:10px}button{background:#132d3c;color:white;border:1px solid #3a768d;padding:12px 14px;border-radius:10px;font:inherit;flex:1}button:focus{outline:3px solid #56ddff;outline-offset:3px}footer{border-top:1px solid #254454;padding-top:10px;display:flex;justify-content:space-between;color:#9bb8c8;font-size:13px}.warn{color:#fbc778}@media(max-width:380px){.app{padding:16px;gap:11px}.value{font-size:25px}.meter{padding:12px;min-height:100px}header h1{font-size:21px}}
</style></head><body><div class="app"><header><div><h1>CAN DIAGNOSTIC</h1><small>Glasses Profile Viewer</small></div><div class="tag" id="tag">DEMO DATA</div></header><h2 id="profile">Hatz Generator</h2><main class="grid" id="grid" aria-live="off"></main><nav class="nav"><button type="button" id="prev">◀ Previous</button><button type="button" id="next">Next ▶</button></nav><footer><span>Simulated CAN signals</span><span id="timestamp">Updated 0s ago</span></footer><small class="warn">Synthetic values; this preview is not connected to the ESP32.</small></div>
<script>
'use strict';
const profiles=[
{name:'Hatz Generator',fields:[['Engine RPM','rpm',t=>1800+550*Math.sin(t/2.2),0],['Charge Voltage','V',t=>51.8+1.8*Math.sin(t/1.3),2],['Charge Current','A',t=>42+18*Math.sin(t/1.75),1],['Engine Temp','°C',t=>82+5*Math.sin(t/7),0]]},
{name:'Vanguard Drive',fields:[['Motor RPM','rpm',t=>2100+700*Math.sin(t/2),0],['Battery','V',t=>52+1.3*Math.sin(t/4),1],['Controller Temp','°C',t=>58+7*Math.sin(t/8),0],['Phase Current','A',t=>115+45*Math.sin(t/1.7),0]]},
{name:'IQAN Sprayer',fields:[['Machine Speed','mph',t=>3+0.6*Math.sin(t/4),1],['Pump Pressure','psi',t=>54+6*Math.sin(t/2),0],['Spray Flow','gpm',t=>9+1.2*Math.sin(t/3),1],['Active Beds','',t=>3,0]]}
];
let index=0,divs=[];const grid=document.getElementById('grid');
function select(i){index=(i+profiles.length)%profiles.length;document.getElementById('profile').textContent=profiles[index].name;grid.replaceChildren();divs=profiles[index].fields.map(([name,unit])=>{const b=document.createElement('article');b.className='meter';const a=document.createElement('div');a.className='name';a.textContent=name;const v=document.createElement('div');v.className='value';const u=document.createElement('div');u.className='unit';u.textContent=unit;b.append(a,v,u);grid.append(b);return v});tick()}
function tick(){const t=performance.now()/1000;profiles[index].fields.forEach(([, , fn,digits],i)=>{divs[i].textContent=fn(t).toFixed(digits)});document.getElementById('timestamp').textContent='Updated just now'}
document.getElementById('prev').onclick=()=>select(index-1);document.getElementById('next').onclick=()=>select(index+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){select(index+1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){select(index-1);e.preventDefault()}});select(0);setInterval(tick,300);
</script></body></html>
